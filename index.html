<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire inscription - RECAP BAC</title>
    <link rel="stylesheet" href="Style.css">
    <script src="Sript.js" defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <form id="Formulaire" action="">
        <h1>INSCRIPTION RECAP BAC</h1>

        <div class="form-grid">
            <!-- Colonne 1 -->
            <div class="form-group">
                <label for="nom">Nom <span class="fois">*</span></label>
                <input id="nom" type="text" placeholder="Yao" required>
            </div>

            <!-- Colonne 2 -->
            <div class="form-group">
                <label for="prenom">Prénoms <span class="fois">*</span></label>
                <input id="prenom" type="text" placeholder="Yann Maxim" required>
            </div>

            <!-- Colonne 1 -->
            <div class="form-group">
                <label for="commune">Commune <span class="fois">*</span></label>
                <input id="commune" type="text" placeholder="Cocody" required>
            </div>

            <!-- Colonne 2 -->
            <div class="form-group">
                <label for="matricule">Matricule <span class="fois">*</span></label>
                <input id="matricule" type="text" required maxlength="9" minlength="9" placeholder="20213345Z">
            </div>

            <!-- Colonne 1 -->
            <div class="form-group">
                <label for="serie">Série <span class="fois">*</span></label>
                <input id="serie" type="text" required maxlength="2" placeholder="A1">
            </div>

            <!-- Colonne 2 -->
            <div class="form-group">
                <label for="email">E-mail <span class="fois">*</span></label>
                <input id="email" type="email" placeholder="monmail@gmail.com" required>
            </div>

            <!-- Pleine largeur sur les 2 colonnes -->
            <div class="form-group full-width">
                <label for="numero">Numéro de téléphone <span class="fois">*</span></label>
                <input id="numero" type="tel" required maxlength="10" minlength="10" placeholder="0505667345">
            </div>
        </div>

        <button id="boutton-valid" type="submit">ENVOYER MON INSCRIPTION</button>
    </form>

</body>
</html>
